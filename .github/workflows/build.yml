name: Build and Release

# release/* branch - Docker image only (tag release-<x>),
# v*.*.* tag - binaries, GitHub Release and Docker image (<version>, <major>.<minor>, latest)
on:
  push:
    branches: [ "release/*" ]
    tags: [ "v*.*.*" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # pkg/ is not part of the build, so packages are listed explicitly
  PACKAGES: ./api/... ./events/... ./main/... ./pinger/... ./prom/... ./state/... ./web/...

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go vet $PACKAGES
      - run: go test $PACKAGES

  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build_date: ${{ steps.v.outputs.build_date }}
    steps:
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

  build:
    name: Build linux/${{ matrix.goarch }}
    if: github.ref_type == 'tag'
    needs: [ test, version ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [ amd64, arm64 ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.version.outputs.version }}
          BUILD_DATE: ${{ needs.version.outputs.build_date }}
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.VERSION=${VERSION} -X main.BUILD_DATE=${BUILD_DATE}" \
            -o "dist/icmp-pinger-linux-${GOARCH}" \
            ./main

      - uses: actions/upload-artifact@v4
        with:
          name: icmp-pinger-linux-${{ matrix.goarch }}
          path: dist/icmp-pinger-linux-${{ matrix.goarch }}
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [ build, version ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          append_body: true
          body: |
            Docker image: `ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}`
          files: dist/*

  docker:
    name: Build and push Docker image
    needs: [ test, version ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            BUILD_DATE=${{ needs.version.outputs.build_date }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
