#Идентификатор пингера (передается в API как ?ident=)
ident: ${PINGER_IDENT:PINGER}
#Период циклов. Если цикл длится дольше - следующий начинается сразу. 0 - без пауз
sleep_interval: ${SLEEP_INTERVAL:30s}

log:
  #debug, info, warn, error
  level: ${LOG_LEVEL:info}
  #text или json
  format: ${LOG_FORMAT:text}

api:
  #Список хостов: {"data": [{"ip": "..", "status": 100|0|null, "target_group": "..", "_attr": ..}]}
  host_list_url: ${API_HOST_LIST_URL:http://127.0.0.1:9099/api/v1/component/pinger/pinger}
  #Период обновления списка хостов (в фоне)
  host_list_refresh_interval: ${API_HOST_LIST_REFRESH_INTERVAL:5m}
  #Игнорировать статусы из списка (как status: null) - используются статусы с прошлого прохода
  ignore_host_list_statuses: ${API_IGNORE_HOST_LIST_STATUSES:false}
  #Репорты: POST массива хостов с изменившимся статусом (ip, status, target_group, icmp, tcp, latency*, loss, _атрибуты)
  report_url: ${API_REPORTS_URL:http://127.0.0.1:9099/api/v1/component/pinger/pinger}
  report_enabled: ${API_REPORTS_ENABLED:true}
  timeout: ${API_TIMEOUT:30s}

#Статусы: 1-100 - up, процент полученных пакетов за цикл (100 - все ответы, даже за одну инспекцию), 0 - down, 999 - доступен только по TCP.
#Репорт отправляется при любом изменении статуса, в том числе процента.
#Хост, подтвердивший статус в инспекции, выбывает из цикла; остальные проверяются повторно.
icmp:
  #Максимум инспекций в цикле
  inspections: ${ICMP_INSPECTIONS:10}
  #up -> down: столько провальных инспекций подряд
  failed_for_down: ${ICMP_FAILED_FOR_DOWN:10}
  #down -> up: столько успешных инспекций подряд
  success_for_up: ${ICMP_SUCCESS_FOR_UP:2}
  #Пакетов на хост в инспекции (успешна, если пришел хотя бы один ответ)
  packets: ${ICMP_PACKETS:4}
  #Общий темп отправки, пакетов/с. 0 - без ограничения. Замеры на 55к хостов: до 20-30к/с потери не растут
  packets_per_second: ${ICMP_PACKETS_PER_SECOND:15000}
  #Ожидание ответов после отправки всех пакетов инспекции
  response_timeout: ${ICMP_RESPONSE_TIMEOUT:2s}
  #Пауза между инспекциями
  inspection_interval: ${ICMP_INSPECTION_INTERVAL:3s}
  ipv6: ${ICMP_IPV6:false}

#TCP-проверка хостов, которые падают по ICMP
tcp:
  enabled: ${TCP_ENABLED:true}
  ports: ${TCP_PORTS:[80]}
  workers: ${TCP_WORKERS:50}
  #Таймаут подключения к каждому порту
  timeout: ${TCP_TIMEOUT:5s}

#Реалтайм-состояния внутри цикла (API, дашборд, события redis). Статус фиксируется после всех инспекций
realtime:
  #up-хост "падает" (falling) после N провальных инспекций
  falling_after_inspections: ${REALTIME_FALLING_AFTER_INSPECTIONS:3}
  #down-хост "поднимается" (rising) после N успешных инспекций
  rising_after_inspections: ${REALTIME_RISING_AFTER_INSPECTIONS:1}

#Дашборд (/), API (/api/v1/...), метрики (/metrics)
web:
  listen: ${WEB_LISTEN::2112}
  #Профилирование /debug/pprof/
  pprof: ${WEB_PPROF:false}

prometheus:
  enabled: ${PROMETHEUS_ENABLED:true}
  #none | basic (status, up, icmp, loss, пакеты) | detailed (+ loss по окнам 1m/5m, tcp, циклы)
  host_metrics: ${PROMETHEUS_HOST_METRICS:basic}
  #none | avg (среднее за проход) | all (+ min/max/avg по окнам cycle/1m/5m)
  latency_metrics: ${PROMETHEUS_LATENCY_METRICS:avg}
  #info - атрибуты только в icmp_pinger_peer_info | all - лейблами на каждой метрике хоста
  attribute_labels: ${PROMETHEUS_ATTRIBUTE_LABELS:all}

#События и репорты в redis pub/sub (PUBLISH <канал> <json>)
redis:
  enabled: ${REDIS_ENABLED:false}
  addr: ${REDIS_ADDR:127.0.0.1:6379}
  password: ${REDIS_PASSWORD:}
  db: ${REDIS_DB:0}
  #Канал событий (status_changed, falling, rising, *_cancelled, host_added, host_removed). Пусто - не отправлять
  events_key: ${REDIS_EVENTS_KEY:pinger:events}
  #Канал репортов. Пусто - не отправлять
  reports_key: ${REDIS_REPORTS_KEY:pinger:reports}
  #Очередь отправки, при переполнении сообщения отбрасываются
  queue_size: ${REDIS_QUEUE_SIZE:100000}
